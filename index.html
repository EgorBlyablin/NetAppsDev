<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор | Альфа-Банк</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" type="text/javascript"></script>
</head>

<body>
    <div class="calculator__wrapper">
        <div class="calculator">
            <div class="result" id="result">0</div>
            <div>
                <button class="btn btn--secondary" id="btn_op_clear" title="Очистка ввода">C</button>
                <button class="btn btn--secondary" id="btn_op_sign">±</button>
                <button class="btn btn--secondary" id="btn_op_percent">%</button>
                <button class="btn btn--primary" id="btn_op_div">/</button>
                <button class="btn btn--secondary" id="btn_op_sqrt" title="Квадратный корень">√</button>
            </div>
            <div>
                <button class="btn" id="btn_digit_7">7</button>
                <button class="btn" id="btn_digit_8">8</button>
                <button class="btn" id="btn_digit_9">9</button>
                <button class="btn btn--primary" id="btn_op_mult">×</button>
                <button class="btn btn--secondary" id="btn_op_square" title="Возведение в квадрат">x²</button>
            </div>
            <div>
                <button class="btn" id="btn_digit_4">4</button>
                <button class="btn" id="btn_digit_5">5</button>
                <button class="btn" id="btn_digit_6">6</button>
                <button class="btn btn--primary" id="btn_op_minus">-</button>
                <button class="btn btn--secondary" id="btn_op_factorial" title="Факториал">x!</button>
            </div>
            <div>
                <button class="btn" id="btn_digit_1">1</button>
                <button class="btn" id="btn_digit_2">2</button>
                <button class="btn" id="btn_digit_3">3</button>
                <button class="btn btn--primary" id="btn_op_plus">+</button>
                <button class="btn btn--secondary" id="btn_op_triple_zeros">000</button>
            </div>
            <div>
                <button class="btn" id="btn_digit_0">0</button>
                <button class="btn" id="btn_digit_dot">.</button>
                <button class="btn btn--primary btn--execute" id="btn_op_equal">=</button>
                <button class="btn btn--secondary" id="btn_op_moon"
                    title="Ускорение тела на высоте (в км) на Луне">🌚</button>
            </div>
        </div>
        <div class="calculator__author">ЛР выполнил Егор Бляблин</div>
    </div>
</body>

</html>
